name: pki-certificate-rollover-impact

services:
  db:
    image: postgres:16-alpine
    container_name: pki-certificate-rollover-impact-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: pki-certificate-rollover-impact-backend
    environment:
      PORT: "8080"
      DB_DRIVER: ${DB_DRIVER}
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      GIN_MODE: ${GIN_MODE}
      LOGIN_LIMIT_PER_MINUTE: ${LOGIN_LIMIT_PER_MINUTE}
      CERT_IMPORT_LIMIT_PER_MINUTE: ${CERT_IMPORT_LIMIT_PER_MINUTE}
      SIMULATION_LIMIT_PER_MINUTE: ${SIMULATION_LIMIT_PER_MINUTE}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: pki-certificate-rollover-impact-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
    name: pki-certificate-rollover-impact-postgres-data
